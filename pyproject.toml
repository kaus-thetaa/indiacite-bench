[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indiacite-bench"
version = "0.1.0"
description = "benchmark and audit tools for citation errors in indian legal ai output"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
ml = ["numpy>=1.26", "scikit-learn>=1.4"]
cpu = ["transformers>=4.44"]
gpu = ["transformers>=4.44", "accelerate>=0.33", "bitsandbytes>=0.43"]

[project.scripts]
indiacite = "indiacite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
